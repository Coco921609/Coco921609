name: Update profile projects

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Update the projects section
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = "Coco921609";
            const profileRepo = "Coco921609";
            const readmePath = "README.md";
            const start = "<!-- PROJECTS:START -->";
            const end = "<!-- PROJECTS:END -->";

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              { username: owner, type: "public", sort: "updated", direction: "desc", per_page: 100 }
            );

            const projects = repos
              .filter(repo => !repo.fork && !repo.archived && repo.name !== profileRepo)
              .sort((a, b) => new Date(b.pushed_at || b.updated_at) - new Date(a.pushed_at || a.updated_at));

            const clean = value => (value || "")
              .replace(/\r?\n/g, " ")
              .replace(/\|/g, "\\|")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");

            const lines = [
              "",
              "_Liste générée automatiquement à partir de tes dépôts publics._",
              ""
            ];

            if (projects.length === 0) {
              lines.push("_Aucun projet public à afficher pour le moment._");
            } else {
              for (const repo of projects) {
                const description = clean(repo.description) || "Aucune description disponible.";
                const language = clean(repo.language) || "Non spécifié";
                const updated = repo.pushed_at
                  ? new Date(repo.pushed_at).toISOString().slice(0, 10)
                  : "Date indisponible";
                lines.push(`- **[${clean(repo.name)}](${repo.html_url})** — ${description}  `);
                lines.push(`  - Langage principal : ${language} · Dernier push : ${updated}`);
              }
            }

            lines.push("");
            const generated = `\n${start}${lines.join("\n")}\n${end}\n`;

            const file = await github.rest.repos.getContent({
              owner,
              repo: profileRepo,
              path: readmePath
            });

            if (!file.data || Array.isArray(file.data) || !file.data.content) {
              throw new Error("Impossible de lire le README du profil.");
            }

            const current = Buffer.from(file.data.content, "base64").toString("utf8");
            const markerPattern = new RegExp(
              start.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") +
              "[\\s\\S]*?" +
              end.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
            );

            if (!markerPattern.test(current)) {
              throw new Error("Les marqueurs PROJECTS:START/END sont introuvables dans README.md.");
            }

            const updatedReadme = current.replace(markerPattern, generated.trimEnd());
            if (updatedReadme === current) {
              core.info("La section des projets est déjà à jour.");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo: profileRepo,
              path: readmePath,
              message: "chore: automatically update public projects section",
              sha: file.data.sha,
              content: Buffer.from(updatedReadme, "utf8").toString("base64")
            });

            core.info(`Section des projets mise à jour : ${projects.length} dépôt(s) public(s).`);
